services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: sgdm2
      MYSQL_ROOT_PASSWORD: sgdm123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

volumes:
  mysql_data: